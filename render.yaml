services:
  - type: worker
    name: asila-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TG_TOKEN
        sync: false
      - key: ASILA_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        value: gemini-2.5-flash
      - key: BOT_NAME
        value: Do'stcha
      - key: DB_PATH
        value: /data/data.db
